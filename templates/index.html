<!DOCTYPE html>
<html>
<head>
    <title>Inference Tester</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; line-height: 1.6; }
        #progress-box { background: #f4f4f4; padding: 10px; border-radius: 5px; height: 150px; overflow-y: auto; border: 1px solid #ddd; }
        #results { margin-top: 20px; border-top: 2px solid #333; padding-top: 20px; }
        .status-msg { color: #555; font-style: italic; }
    </style>
</head>
<body>
    <h1>Research Verification API</h1>
    
    <input type="text" id="queryInput" placeholder="Enter claim to verify..." style="width: 80%; padding: 10px;">
    <button onclick="sendQuery()" style="padding: 10px;">Verify</button>

    <h3>Progress Log</h3>
    <div id="progress-box"></div>

    <div id="results">
        <h3>Final Verdict</h3>
        <pre id="verdict-data">Results will appear here...</pre>
    </div>

    <script>
        const socket = io('http://localhost:5000');

        socket.on('progress', (data) => {
            const box = document.getElementById('progress-box');
            box.innerHTML += `<p class="status-msg">[${data.status}] ${data.msg}</p>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('final_result', (data) => {
            document.getElementById('verdict-data').innerText = JSON.stringify(data, null, 2);
        });

        socket.on('error', (data) => {
            alert("Error: " + data.msg);
        });

        function sendQuery() {
            const query = document.getElementById('queryInput').value;
            document.getElementById('progress-box').innerHTML = "";
            document.getElementById('verdict-data').innerText = "Processing...";
            socket.emit('inference', { query: query });
        }
    </script>
</body>
</html>
